<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>{{STYLE}}</style></head><body>
<header id="top"><div class="masthead"><b>{{COURSE}}</b><span>课程学习笔记</span></div><div class="hero"><div><div class="hero-kicker">LECTURE {{ISSUE}}</div><h1>{{HEADING}}</h1><p class="hero-subtitle">{{SUBTITLE}}</p><div class="hero-meta"><span>{{META}}</span>{{SOURCE}}</div></div><div class="issue-number" aria-hidden="true">{{ISSUE}}</div></div></header>
<div class="mode-bar" role="group" aria-label="阅读深度"><button type="button" data-mode="visual" aria-pressed="true">图解速读</button><button type="button" data-mode="full" aria-pressed="false">完整笔记</button><span class="mode-hint">图解速读只收起细节，不删除内容；页内搜索会自动展开。</span></div>
<div class="reading-layout">{{TOC}}<main><details class="reading-scope"><summary>来源与阅读范围</summary><aside>{{LIMITS}}</aside></details>{{BODY}}<footer class="reading-footer">{{COURSE}} · {{ISSUE}}<a href="#top">返回页首 ↑</a></footer></main></div>
<dialog aria-label="大图"><button id="close">关闭</button><button id="actual-size" aria-pressed="false">原尺寸</button><small class="zoom-hint">原尺寸下可左右、上下滑动查看细节。</small><div class="image-viewport"><img alt="放大图"></div></dialog><script>{{SCRIPT}}</script></body></html>
