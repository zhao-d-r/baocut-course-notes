<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>z-score 以标准差衡量偏离，ATR 以价格衡量波幅并用作止损尺度，两者不能混用</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="10" y="10" width="380" height="150" rx="12" fill="#e6efe8"/><text x="200.0" y="57.31999999999999" font-size="19" fill="#244e3d" text-anchor="middle" font-weight="700">z-score · 单位：标准差</text><text x="200.0" y="80.91" font-size="17" fill="#242b29" text-anchor="middle">当前价离均值几个 σ</text><text x="200.0" y="103.86" font-size="17" fill="#244e3d" text-anchor="middle">做多：盼负向极值</text><text x="200.0" y="126.81" font-size="17" fill="#974c35" text-anchor="middle">做空：偏好正向大偏离</text><rect x="10" y="172" width="380" height="150" rx="12" fill="#f0eee5"/><text x="200.0" y="219.32" font-size="19" fill="#242b29" text-anchor="middle" font-weight="700">ATR · 单位：价格</text><text x="200.0" y="242.91000000000003" font-size="17" fill="#242b29" text-anchor="middle">真实波幅的平滑</text><text x="200.0" y="265.86" font-size="17" fill="#242b29" text-anchor="middle">本课用作止损尺度</text><text x="200.0" y="288.81" font-size="17" fill="#5a4775" text-anchor="middle">只量波动，不指方向</text><rect x="10" y="334" width="380" height="66" rx="12" fill="#f6e8e1"/><text x="200.0" y="362.945" font-size="19" fill="#974c35" text-anchor="middle" font-weight="700">两把尺子不能混用</text><text x="200.0" y="385.505" font-size="16" fill="#242b29" text-anchor="middle">本课没给统一的 ATR 止损倍数</text></svg>
