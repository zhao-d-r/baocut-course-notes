<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>均值回归的风险包括看错方向和进得太早：不要沿亏损仓位不断补仓；讲师承认自己常接飞刀，在NVO上先抄、次日止损、再跌后重新入场</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><text x="10" y="28" font-size="21" fill="#974c35" text-anchor="start" font-weight="700">✗ 沿亏损仓位不断补仓</text><path d="M20 50 L90 90 L160 130 L230 170 L300 210" stroke="#974c35" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="90" r="7" fill="#f6e8e1" stroke="#974c35" stroke-width="2"/><circle cx="160" cy="130" r="11" fill="#f6e8e1" stroke="#974c35" stroke-width="2"/><circle cx="230" cy="170" r="15" fill="#f6e8e1" stroke="#974c35" stroke-width="2"/><text x="10" y="248" font-size="18" fill="#242b29" text-anchor="start">跌了就补仓，仓位越补越大</text><text x="10" y="300" font-size="21" fill="#244e3d" text-anchor="start" font-weight="700">他的应对（NVO）：止损再入场</text><text x="10" y="340" font-size="18" fill="#242b29" text-anchor="start">① 财报后大跌约 20%，抄一下</text><text x="10" y="374" font-size="18" fill="#974c35" text-anchor="start" font-weight="700">② 第二天又跌：立刻止损</text><text x="10" y="408" font-size="18" fill="#244e3d" text-anchor="start" font-weight="700">③ 第三天再跌后重新入场</text><text x="10" y="480" font-size="17" fill="#636c66" text-anchor="start">讲师也承认自己常「接飞刀」：进得太早</text><text x="10" y="508" font-size="17" fill="#636c66" text-anchor="start">跌得多 ≠ 已到底，可能永久亏损</text></svg>
