<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>讲师称 XLE 在 +3σ 附近高位运行一个多月：刚触及就逆向可能过早，停留约一个月后再逆向他认为胜率较高；但他当时看油价还有上行空间，不认为有必要立刻做空</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><path d="M58 50 H390" stroke="#dcded4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="10" y="56" font-size="16" fill="#636c66" text-anchor="start">+3σ</text><path d="M58 92 H390" stroke="#dcded4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="10" y="98" font-size="16" fill="#636c66" text-anchor="start">+2σ</text><path d="M58 134 H390" stroke="#dcded4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="10" y="140" font-size="16" fill="#636c66" text-anchor="start">+1σ</text><path d="M58 186 H390" stroke="#636c66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="10" y="192" font-size="16" fill="#636c66" text-anchor="start">均线</text><path d="M58 178 C 80 170, 90 90, 110 54 S 150 42, 180 52 S 240 42, 280 54 S 340 44, 390 52" stroke="#244e3d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 30 V230" stroke="#974c35" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M300 30 V230" stroke="#244e3d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M112 222 H298" stroke="#636c66" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="205" y="214" font-size="16" fill="#636c66" text-anchor="middle">高位运行一个多月</text><text x="390" y="22" font-size="16" fill="#636c66" text-anchor="end">示意，非原图数据</text><rect x="10" y="252" width="380" height="88" rx="12" fill="#f6e8e1"/><text x="200.0" y="291.27" font-size="19" fill="#974c35" text-anchor="middle" font-weight="700">刚碰 3σ 就逆向做空</text><text x="200.0" y="314.85999999999996" font-size="17" fill="#242b29" text-anchor="middle">可能过早：还会高位盘整</text><rect x="10" y="352" width="380" height="88" rx="12" fill="#e6efe8"/><text x="200.0" y="391.27" font-size="19" fill="#244e3d" text-anchor="middle" font-weight="700">停留约一个月后再逆向</text><text x="200.0" y="414.85999999999996" font-size="17" fill="#242b29" text-anchor="middle">讲师认为胜率相对较高</text><rect x="10" y="452" width="380" height="70" rx="12" fill="#f0eee5"/><text x="200.0" y="481.56" font-size="17" fill="#242b29" text-anchor="middle" font-weight="700">但他当时看油价可能到 100</text><text x="200.0" y="504.51" font-size="17" fill="#242b29" text-anchor="middle">当时不认为有必要立刻做空</text><text x="10" y="548" font-size="16" fill="#636c66" text-anchor="start">原图为 2h AVWAP_SD，σ 口径未核实</text></svg>
