<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 510" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>讲师近似个人配置：波段约60%、长期不超过35%、投机5到10%；长期用9个月以上LEAPS，波段用6到9个月期权</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><text x="10" y="28" font-size="18" fill="#242b29" text-anchor="start" font-weight="700">讲师的近似个人配置，非推荐</text><rect x="10" y="46" width="228" height="60" rx="6" fill="#f0eee5"/><text x="124" y="84" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">波段 ~60%</text><rect x="238" y="46" width="126" height="60" rx="0" fill="#e6efe8"/><text x="301" y="84" font-size="17" fill="#244e3d" text-anchor="middle" font-weight="700">长期≤35%</text><rect x="364" y="46" width="26" height="60" rx="6" fill="#f6e8e1"/><text x="390" y="132" font-size="16" fill="#974c35" text-anchor="end" font-weight="700">投机 5–10%</text><rect x="10" y="150" width="380" height="150" rx="12" fill="#e6efe8"/><text x="200.0" y="199.025" font-size="20" fill="#244e3d" text-anchor="middle" font-weight="700">长期</text><text x="200.0" y="222.935" font-size="17" fill="#242b29" text-anchor="middle">计划持有 3 个月以上</text><text x="200.0" y="244.855" font-size="16" fill="#242b29" text-anchor="middle">LEAPS 9 个月以上（上节口述 12 个月）</text><text x="200.0" y="266.455" font-size="16" fill="#242b29" text-anchor="middle">约&gt;10% 虚值 · 单腿只做多 · 均值回归</text><rect x="10" y="312" width="380" height="120" rx="12" fill="#f0eee5"/><text x="200.0" y="356.15000000000003" font-size="20" fill="#242b29" text-anchor="middle" font-weight="700">波段</text><text x="200.0" y="380.06" font-size="17" fill="#242b29" text-anchor="middle">单腿 · 6–9 个月到期</text><text x="200.0" y="403.01" font-size="17" fill="#242b29" text-anchor="middle">最接近实值的虚值期权</text><rect x="10" y="444" width="380" height="52" rx="12" fill="#f6e8e1"/><text x="200.0" y="476.03499999999997" font-size="17" fill="#974c35" text-anchor="middle" font-weight="700">两类期权交易都尽量选低 β 标的</text></svg>
