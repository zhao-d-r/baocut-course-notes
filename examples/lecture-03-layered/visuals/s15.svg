<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>两次空头遇反弹看起来相似结果不同，答案不在K线里，而在事先定好的时间框架和失效条件</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="10" y="10" width="160" height="84" rx="12" fill="#f0eee5"/><text x="90.0" y="46.24" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">空头持仓</text><text x="90.0" y="70.53999999999999" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">遇到强反弹</text><path d="M172 52 C 230 52, 250 10, 300 14 L 390 10" stroke="#974c35" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M172 52 C 230 52, 250 50, 280 34 L 320 90 L 390 112" stroke="#244e3d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="10" y="132" font-size="17" fill="#636c66" text-anchor="start">当时看起来一样，结果：</text><text x="10" y="162" font-size="18" fill="#974c35" text-anchor="start" font-weight="700">一次持续上涨</text><text x="10" y="190" font-size="18" fill="#244e3d" text-anchor="start" font-weight="700">另一次涨两三天又回落</text><rect x="10" y="214" width="380" height="196" rx="12" fill="#e6efe8"/><text x="200.0" y="279.24" font-size="18" fill="#636c66" text-anchor="middle">答案不在这根 K 线里</text><text x="200.0" y="303.54" font-size="18" fill="#242b29" text-anchor="middle">当时该问：</text><text x="200.0" y="329.90000000000003" font-size="20" fill="#244e3d" text-anchor="middle" font-weight="700">这笔交易的时间框架？</text><text x="200.0" y="356.90000000000003" font-size="20" fill="#244e3d" text-anchor="middle" font-weight="700">什么情况算逻辑失效？</text></svg>
