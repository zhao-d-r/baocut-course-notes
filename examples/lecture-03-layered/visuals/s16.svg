<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>时间框架：短线日内到约一周、波段1到8周、长线三个月以上；先定期限再配策略和仓位</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="10" y="10" width="380" height="56" rx="8" fill="#f0eee5"/><text x="30" y="46" font-size="20" fill="#242b29" text-anchor="start" font-weight="700">短线</text><text x="370" y="46" font-size="18" fill="#242b29" text-anchor="end">日内 至 约 1 周</text><rect x="10" y="76" width="380" height="56" rx="8" fill="#e6efe8"/><text x="30" y="112" font-size="20" fill="#244e3d" text-anchor="start" font-weight="700">波段</text><text x="370" y="112" font-size="18" fill="#242b29" text-anchor="end">1–8 周</text><rect x="10" y="142" width="380" height="56" rx="8" fill="#e6efe8"/><text x="30" y="178" font-size="20" fill="#244e3d" text-anchor="start" font-weight="700">长线</text><text x="370" y="178" font-size="18" fill="#242b29" text-anchor="end">3 个月以上</text><text x="10" y="228" font-size="16" fill="#636c66" text-anchor="start">1–3 个月之间没有严格分界</text><rect x="10" y="246" width="380" height="144" rx="12" fill="#f0eee5"/><text x="200.0" y="290.675" font-size="20" fill="#242b29" text-anchor="middle" font-weight="700">入场前先定：拿多久</text><text x="200.0" y="314.585" font-size="17" fill="#242b29" text-anchor="middle">再配策略、标的、止盈止损</text><text x="200.0" y="337.53499999999997" font-size="17" fill="#242b29" text-anchor="middle">讲师倾向非专职者做波段/长线</text><text x="200.0" y="360.48499999999996" font-size="17" fill="#974c35" text-anchor="middle" font-weight="700">不是永久持有的借口</text></svg>
