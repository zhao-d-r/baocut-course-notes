<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>讲师只看两种图形：矩形突破要至少约一年箱体并同时突破MA200；他的经验是V形急变往往回踩，所以等回踩而不追第一下</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><text x="10" y="30" font-size="21" fill="#244e3d" text-anchor="start" font-weight="700">矩形突破</text><text x="390" y="30" font-size="16" fill="#636c66" text-anchor="end">示意</text><rect x="20" y="66" width="220" height="80" rx="4" fill="#e6efe8"/><path d="M20 140 L50 76 L80 136 L110 72 L140 138 L170 74 L200 136 L240 120 L270 50 L300 36" stroke="#244e3d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 104 C 120 110, 220 100, 310 96" stroke="#242b29" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="318" y="102" font-size="16" fill="#242b29" text-anchor="start">MA200</text><text x="10" y="182" font-size="17" fill="#242b29" text-anchor="start">箱体 ≥ 约一年＋突破上沿＋站上 MA200</text><text x="10" y="208" font-size="17" fill="#636c66" text-anchor="start">讲师经验：假突破较少</text><text x="10" y="262" font-size="21" fill="#974c35" text-anchor="start" font-weight="700">V 形急变</text><text x="390" y="262" font-size="16" fill="#636c66" text-anchor="end">示意：急跌后急涨</text><path d="M20 284 L90 390 L130 300 L160 346 L200 322 L300 270" stroke="#974c35" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="346" r="9" fill="none" stroke="#974c35" stroke-width="3"/><text x="178" y="372" font-size="18" fill="#974c35" text-anchor="start" font-weight="700">回踩</text><text x="10" y="430" font-size="17" fill="#242b29" text-anchor="start">讲师经验：急变后往往还会回踩</text><text x="10" y="458" font-size="17" fill="#242b29" text-anchor="start">所以他等回踩，不追第一下</text><text x="10" y="486" font-size="17" fill="#636c66" text-anchor="start">期权持仓怕回踩，他通常规避</text></svg>
