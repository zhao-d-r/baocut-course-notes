<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>困境反转三道筛选：股价自高点跌一半以上、长期估值低位、具体催化剂，三者齐备才进入</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="10.0" y="10" width="380" height="60" rx="12" fill="#f6e8e1"/><text x="200.0" y="46.745000000000005" font-size="19" fill="#974c35" text-anchor="middle" font-weight="700">① 自 52 周高点跌 ≥ 50%</text><rect x="40.0" y="82" width="320" height="60" rx="12" fill="#f0eee5"/><text x="200.0" y="118.745" font-size="19" fill="#242b29" text-anchor="middle" font-weight="700">② 长期估值历史低位</text><rect x="70.0" y="154" width="260" height="60" rx="12" fill="#e6efe8"/><text x="200.0" y="190.745" font-size="19" fill="#244e3d" text-anchor="middle" font-weight="700">③ 有具体催化剂</text><path d="M200 228 L200 250" stroke="#244e3d" stroke-width="3" fill="none" marker-end="url(#g)"/><rect x="100" y="254" width="200" height="52" rx="12" fill="#244e3d"/><text x="200.0" y="286.745" font-size="19" fill="#fffdf8" text-anchor="middle" font-weight="700">三者齐备才进入</text><text x="10" y="346" font-size="17" fill="#636c66" text-anchor="start">催化剂例：</text><text x="10" y="374" font-size="18" fill="#242b29" text-anchor="start">NVO：口服减重药</text><text x="10" y="402" font-size="18" fill="#242b29" text-anchor="start">FISV：激进投资人入场</text><text x="10" y="448" font-size="18" fill="#974c35" text-anchor="start" font-weight="700">说不清催化剂 → 放弃</text></svg>
