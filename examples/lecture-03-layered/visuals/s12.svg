<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>困境反转先看两道筛选：股价自52周高点至少跌一半，且估值倍数处于5到20年历史低位</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="10" y="10" width="380" height="120" rx="12" fill="#f6e8e1"/><text x="200.0" y="65.305" font-size="21" fill="#974c35" text-anchor="middle" font-weight="700">股价跌幅</text><text x="200.0" y="90.565" font-size="18" fill="#242b29" text-anchor="middle">自 52 周高点至少跌一半</text><text x="200" y="162" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">＋ 两个条件都要</text><rect x="10" y="180" width="380" height="120" rx="12" fill="#e6efe8"/><text x="200.0" y="224.505" font-size="21" fill="#244e3d" text-anchor="middle" font-weight="700">估值倍数</text><text x="200.0" y="249.76500000000001" font-size="18" fill="#242b29" text-anchor="middle">处于 5–10 年甚至 20 年低位</text><text x="200.0" y="272.005" font-size="16" fill="#636c66" text-anchor="middle">如 EV/EBITDA（NTM）</text><rect x="10" y="312" width="380" height="58" rx="12" fill="#f0eee5"/><text x="200.0" y="347.39000000000004" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">比倍数，不比二十年前的股价</text></svg>
