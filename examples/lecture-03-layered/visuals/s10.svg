<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>龙头相对方向定义：做多选最强，做空选最弱的领跌者，如当时航空股中的AAL</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="10" y="10" width="185" height="100" rx="12" fill="#e6efe8"/><text x="102.5" y="56.335" font-size="22" fill="#244e3d" text-anchor="middle" font-weight="700">做多</text><text x="102.5" y="80.885" font-size="17" fill="#242b29" text-anchor="middle">选最强的</text><rect x="205" y="10" width="185" height="100" rx="12" fill="#f6e8e1"/><text x="297.5" y="56.335" font-size="22" fill="#974c35" text-anchor="middle" font-weight="700">做空</text><text x="297.5" y="80.885" font-size="17" fill="#242b29" text-anchor="middle">选最弱的领跌者</text><text x="10" y="152" font-size="17" fill="#636c66" text-anchor="start">航空例（做空）</text><rect x="10" y="168" width="116" height="48" rx="8" fill="#f6e8e1"/><text x="68" y="199" font-size="19" fill="#974c35" text-anchor="middle" font-weight="700">AAL</text><rect x="138" y="168" width="116" height="48" rx="8" fill="#f0eee5"/><text x="196" y="199" font-size="19" fill="#636c66" text-anchor="middle">UAL</text><rect x="266" y="168" width="116" height="48" rx="8" fill="#f0eee5"/><text x="324" y="199" font-size="19" fill="#636c66" text-anchor="middle">DAL</text><text x="10" y="248" font-size="18" fill="#974c35" text-anchor="start" font-weight="700">当时 AAL 最弱 → 直接选它</text><rect x="10" y="270" width="380" height="100" rx="12" fill="#f0eee5"/><text x="200.0" y="313.885" font-size="17" fill="#242b29" text-anchor="middle" font-weight="700">讲师经验：不等二、三名补涨补跌</text><text x="200.0" y="337.865" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">龙头不必是最大或最有名</text></svg>
