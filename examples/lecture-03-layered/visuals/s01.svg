<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>基本面决定做什么，技术指标只辅助安排进出时机；离场还看盈亏与仓位；没有圣杯指标</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="10" y="10" width="380" height="86" rx="12" fill="#e6efe8"/><text x="200.0" y="48.625" font-size="20" fill="#244e3d" text-anchor="middle" font-weight="700">基本面：决定做什么</text><text x="200.0" y="72.535" font-size="17" fill="#242b29" text-anchor="middle">拐点 · 仓位 · 板块轮换</text><path d="M200 98 L200 124" stroke="#636c66" stroke-width="3" fill="none" marker-end="url(#m)"/><rect x="10" y="128" width="380" height="86" rx="12" fill="#f0eee5"/><text x="200.0" y="166.625" font-size="20" fill="#242b29" text-anchor="middle" font-weight="700">技术指标：辅助安排进出时机</text><text x="200.0" y="190.53500000000003" font-size="17" fill="#636c66" text-anchor="middle">只用少数、自己熟悉的</text><rect x="10" y="230" width="380" height="90" rx="12" fill="#f6e8e1"/><text x="200.0" y="269.24" font-size="18" fill="#974c35" text-anchor="middle" font-weight="700">离场还看持仓盈亏与仓位</text><text x="200.0" y="293.54" font-size="18" fill="#974c35" text-anchor="middle" font-weight="700">没有「圣杯指标」</text></svg>
