<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>趋势跟随：识别突破、及时建仓、事先定仓位与止损；回撤时触发止损就退出，未触发且理由仍在就拿住</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="40" y="10" width="320" height="66" rx="12" fill="#e6efe8"/><text x="200.0" y="38.94500000000001" font-size="19" fill="#244e3d" text-anchor="middle" font-weight="700">识别突破</text><text x="200.0" y="61.505" font-size="16" fill="#242b29" text-anchor="middle">基本面拐点·仓位＋技术辅助</text><path d="M200 78 L200 100" stroke="#636c66" stroke-width="3" fill="none" marker-end="url(#m)"/><rect x="40" y="104" width="320" height="52" rx="12" fill="#fffdf8" stroke="#dcded4" stroke-width="2"/><text x="200.0" y="136.39000000000001" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">及时建仓，不等完美点位</text><path d="M200 158 L200 180" stroke="#636c66" stroke-width="3" fill="none" marker-end="url(#m)"/><rect x="40" y="184" width="320" height="52" rx="12" fill="#fffdf8" stroke="#dcded4" stroke-width="2"/><text x="200.0" y="216.39000000000001" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">事先定好仓位与止损</text><path d="M200 238 L200 260" stroke="#636c66" stroke-width="3" fill="none" marker-end="url(#m)"/><polygon points="200,264 330,316 200,368 70,316" fill="#f0eee5"/><text x="200" y="310" font-size="17" fill="#242b29" text-anchor="middle">价格回撤：</text><text x="200" y="334" font-size="18" fill="#242b29" text-anchor="middle" font-weight="700">触发止损？</text><path d="M120 348 L90 396" stroke="#974c35" stroke-width="3" fill="none" marker-end="url(#r)"/><path d="M280 348 L310 396" stroke="#244e3d" stroke-width="3" fill="none" marker-end="url(#g)"/><rect x="10" y="400" width="175" height="62" rx="12" fill="#f6e8e1"/><text x="97.5" y="437.745" font-size="19" fill="#974c35" text-anchor="middle" font-weight="700">是：退出</text><rect x="215" y="400" width="175" height="62" rx="12" fill="#e6efe8"/><text x="302.5" y="425.56" font-size="17" fill="#244e3d" text-anchor="middle" font-weight="700">否且理由仍在</text><text x="302.5" y="448.51" font-size="17" fill="#244e3d" text-anchor="middle" font-weight="700">拿住</text><text x="200" y="500" font-size="16" fill="#636c66" text-anchor="middle">事后看图容易，当时分不清</text></svg>
