<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>长期篮子与波段篮子事先隔离；做空不放入长期篮子；合约到期时间不等于实际持有期</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="10" y="10" width="380" height="120" rx="12" fill="#e6efe8"/><text x="200.0" y="54.505" font-size="21" fill="#244e3d" text-anchor="middle" font-weight="700">长期篮子</text><text x="200.0" y="78.73500000000001" font-size="17" fill="#242b29" text-anchor="middle">偏困境反转 · 期权约 12 个月以上</text><text x="200.0" y="101.68500000000002" font-size="17" fill="#974c35" text-anchor="middle" font-weight="700">不放空头</text><rect x="10" y="142" width="380" height="120" rx="12" fill="#f0eee5"/><text x="200.0" y="186.505" font-size="21" fill="#242b29" text-anchor="middle" font-weight="700">波段篮子</text><text x="200.0" y="210.735" font-size="17" fill="#242b29" text-anchor="middle">趋势跟随＋仓位扭曲的均值回归</text><text x="200.0" y="233.685" font-size="17" fill="#242b29" text-anchor="middle">期权约 6–9 个月</text><rect x="10" y="274" width="380" height="146" rx="12" fill="#f6e8e1"/><text x="200.0" y="319.675" font-size="20" fill="#974c35" text-anchor="middle" font-weight="700">合约到期 ≠ 实际持有期</text><text x="200.0" y="343.585" font-size="17" fill="#242b29" text-anchor="middle">先分篮子，减少临场冲突</text><text x="200.0" y="366.53499999999997" font-size="17" fill="#242b29" text-anchor="middle">远期合约不会自动</text><text x="200.0" y="389.48499999999996" font-size="17" fill="#242b29" text-anchor="middle">带来纪律或阻止亏损</text></svg>
