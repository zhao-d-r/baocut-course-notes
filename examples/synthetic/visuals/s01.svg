<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" role="img"><title>2、4、6 个方块，把第三行的 2 个移到第一行后每行都是 4 个：平均数等于总量 12 除以样本数 3。</title><defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#636c66"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#244e3d"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#974c35"/></marker><marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a4775"/></marker></defs><rect x="20" y="20" width="22" height="22" rx="4" fill="#244e3d"/><rect x="46" y="20" width="22" height="22" rx="4" fill="#244e3d"/><rect x="20" y="60" width="22" height="22" rx="4" fill="#244e3d"/><rect x="46" y="60" width="22" height="22" rx="4" fill="#244e3d"/><rect x="72" y="60" width="22" height="22" rx="4" fill="#244e3d"/><rect x="98" y="60" width="22" height="22" rx="4" fill="#244e3d"/><rect x="20" y="100" width="22" height="22" rx="4" fill="#244e3d"/><rect x="46" y="100" width="22" height="22" rx="4" fill="#244e3d"/><rect x="72" y="100" width="22" height="22" rx="4" fill="#244e3d"/><rect x="98" y="100" width="22" height="22" rx="4" fill="#244e3d"/><rect x="124" y="100" width="22" height="22" rx="4" fill="#974c35"/><rect x="150" y="100" width="22" height="22" rx="4" fill="#974c35"/><text x="190" y="70" font-size="18" fill="#636c66" text-anchor="start">2 · 4 · 6</text><path d="M200 140 L200 166" stroke="#974c35" stroke-width="3" fill="none" marker-end="url(#r)"/><text x="212" y="160" font-size="17" fill="#974c35" text-anchor="start">移 2 个</text><rect x="20" y="180" width="22" height="22" rx="4" fill="#244e3d"/><rect x="46" y="180" width="22" height="22" rx="4" fill="#244e3d"/><rect x="72" y="180" width="22" height="22" rx="4" fill="#244e3d"/><rect x="98" y="180" width="22" height="22" rx="4" fill="#244e3d"/><rect x="20" y="214" width="22" height="22" rx="4" fill="#244e3d"/><rect x="46" y="214" width="22" height="22" rx="4" fill="#244e3d"/><rect x="72" y="214" width="22" height="22" rx="4" fill="#244e3d"/><rect x="98" y="214" width="22" height="22" rx="4" fill="#244e3d"/><rect x="20" y="248" width="22" height="22" rx="4" fill="#244e3d"/><rect x="46" y="248" width="22" height="22" rx="4" fill="#244e3d"/><rect x="72" y="248" width="22" height="22" rx="4" fill="#244e3d"/><rect x="98" y="248" width="22" height="22" rx="4" fill="#244e3d"/><text x="140" y="220" font-size="18" fill="#242b29" text-anchor="start">均分后每行 4 个</text><rect x="10" y="284" width="380" height="40" rx="12" fill="#e6efe8"/><text x="200.0" y="311.1" font-size="20" fill="#244e3d" text-anchor="middle" font-weight="700">平均数 = 12 ÷ 3 = 4</text></svg>
